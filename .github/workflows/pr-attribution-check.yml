name: PR attribution check

# Harbor 開發規範 4.4：PR 說明、留言與 commit 訊息不加 AI 署名。
# 範本來源：frobel0520/harbor standards/deployment-templates/github-actions/pr-attribution-check.yml，各 repo 原樣複製。
# 1. 移除雲端環境自動補上的固定頁尾（agent 經 API 開 PR 或留言時被補上，agent 自己移除不掉）。
#    GITHUB_TOKEN 的編輯不會再觸發 workflow，不會循環。
# 2. 移除後仍有其他 AI 署名（agent 自己寫的）就失敗，留給人處理。
# 不 checkout、不裝依賴；私人 repo 每次觸發約計 1 分鐘。
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-attribution-${{ github.event.pull_request.number || github.event.comment.id }}
  cancel-in-progress: false

jobs:
  attribution:
    name: No AI attribution
    if: github.event_name == 'pull_request' || github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Strip injected footer and check attribution
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then url="repos/$REPO/pulls/$PR"; else url="repos/$REPO/issues/comments/$COMMENT_ID"; fi
          body="$RUNNER_TEMP/body.md"
          gh api "$url" --jq '.body // ""' > "$body"
          # 只移除結尾那段固定頁尾：「---」加 _Generated by [Claude Code](https://claude.ai/code…)_
          if python3 - "$body" <<'PY'
          import re, sys
          path = sys.argv[1]
          text = open(path, encoding='utf-8').read()
          footer = re.compile(r'\s*(?:^-{3,}\s*\n\s*)?_Generated by \[Claude Code\]\(https://claude\.ai/code[^)\s]*\)_\s*\Z', re.M)
          cleaned = footer.sub('', text)
          if cleaned == text:
              sys.exit(1)
          open(path, 'w', encoding='utf-8').write(cleaned.rstrip() + '\n')
          PY
          then
            gh api -X PATCH "$url" -F "body=@$body" --silent
            echo "已移除雲端環境自動補上的頁尾"
          fi
          tools='Claude|Codex|Copilot|Gemini|Cursor|ChatGPT'
          pattern="Co-Authored-By:.*(${tools}|anthropic\.com|openai\.com)|Generated (with|by) \[?(${tools})|Claude-Session:|claude\.ai/code|chatgpt\.com/codex"
          status=0
          if grep -Eiq "$pattern" "$body"; then
            echo "::error title=說明或留言含 AI 署名::請刪掉下列行（Harbor 開發規範 4.4）"
            grep -Ein "$pattern" "$body"
            status=1
          fi
          if [ "$EVENT" = pull_request ]; then
            gh api --paginate "repos/$REPO/pulls/$PR/commits" \
              --jq '.[] | .sha[0:7] + " " + (.commit.message | gsub("\n"; " | "))' > "$RUNNER_TEMP/commits.txt"
            if grep -Ei "$pattern" "$RUNNER_TEMP/commits.txt"; then
              echo "::error title=commit 訊息含 AI 署名::上列 commit 需由使用者決定是否改寫（Harbor 開發規範 4.4）"
              status=1
            fi
          fi
          exit "$status"
