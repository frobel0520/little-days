name: Harbor propose
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'progress.md']
  workflow_dispatch:
permissions: {}
concurrency:
  group: harbor-proposal-main
  cancel-in-progress: false
jobs:
  propose:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: { contents: read, id-token: write }
    steps:
      - name: Require trusted main
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Propose current commit for Owner approval
        env:
          HARBOR_URL: https://harbor-1wk.pages.dev
        shell: bash
        run: |
          set -euo pipefail
          if ! token="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=harbor-release" | jq -er .value)"; then
            echo '::error title=Harbor proposal::OIDC_TOKEN_REQUEST_FAILED'
            exit 1
          fi
          if ! status="$(curl -sS --max-time 20 -X POST "$HARBOR_URL/api/v1/release-intake" \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            --data '{"project":"little-days","target":"pages","environment":"production"}' \
            -o "$RUNNER_TEMP/harbor-proposal.json" -w '%{http_code}')"; then
            echo '::error title=Harbor proposal::HARBOR_CONNECTION_FAILED'
            exit 1
          fi
          if [ "$status" != 201 ]; then
            code="$(jq -r '.error.code // .code // "UNSPECIFIED"' "$RUNNER_TEMP/harbor-proposal.json" 2>/dev/null || echo UNSPECIFIED)"
            [[ "$code" =~ ^[A-Z0-9_]{1,80}$ ]] || code=UNSPECIFIED
            printf '::error title=Harbor proposal rejected::HTTP %s (%s)\n' "$status" "$code"
            printf 'Harbor proposal rejected: HTTP %s (%s).\n' "$status" "$code" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo 'Harbor accepted the deployment proposal; Owner approval is still required.' >> "$GITHUB_STEP_SUMMARY"
